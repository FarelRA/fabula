# Dev-parity overrides (PLAN §15.4): hot-reload app against the same pinned
# backend/dashboard images used in production.
#
#   docker compose --env-file docker/.env -f docker-compose.yml \
#     -f docker-compose.dev.yml up -d
#
services:
  app:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    environment:
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-http://127.0.0.1:3210}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
