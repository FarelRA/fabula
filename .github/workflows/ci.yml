name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly self-host job
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run terminology
      - run: bun run test
      - run: bun run check:dockerctx
      - run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      - run: bun run check:bundles

  e2e:
    # Playwright against the isolated self-hosted Convex backend + fake model
    # (test:e2e builds the live app and boots scripts/e2e-server.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:e2e
        env:
          FABULA_E2E_PORT: "3100"

  selfhost:
    # Full stack boot on a fresh runner + release drill: compose up → health → functions deploy → seed → smoke → backup.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Configure self-host env
        run: |
          cp docker/.env.example docker/.env
          sed -i "s|^INSTANCE_SECRET=.*|INSTANCE_SECRET=$(openssl rand -base64 32)|" docker/.env
      - name: Log in to GHCR
        # The Convex backend and dashboard images come from ghcr.io; anonymous
        # pulls from shared runner IPs are denied or rate-limited, so the
        # drill pulls them authenticated. The released app image works the
        # same way on any host behind docker login ghcr.io.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release drill (up → health → deploy → seed → smoke → backup)
        run: bun run selfhost:drill --backup-dir backups
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file docker/.env logs --tail 200
      - name: Upload verified backup
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-backup
          path: backups/
          retention-days: 7
