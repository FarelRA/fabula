name: Release

# Cuts a GitHub release for every v* tag and publishes the app image to GHCR:
#   ghcr.io/<owner>/<repo>:<version>, :<major>.<minor>, :latest
#
# The image bakes NEXT_PUBLIC_CONVEX_URL at build time (Next.js inlines
# NEXT_PUBLIC_* values). The default targets the local self-host stack; set a
# repository variable NEXT_PUBLIC_CONVEX_URL to publish images wired to a
# public origin instead.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name (GHCR requires lowercase)
        id: resolve
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ vars.NEXT_PUBLIC_CONVEX_URL || 'http://localhost:3210' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release with notes and image reference
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -q .body > generated-notes.md
          {
            echo "Container image (self-host stack): \`${IMAGE}:${TAG}\`"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Image digest: \`${DIGEST}\`"
            echo
            echo "---"
            echo
            cat generated-notes.md
          } > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
